# Self-hosted local stack: backend API + frontend, both containerized.
# Still requires a Modal account and reviewer API keys in .env — the GPU
# extraction/alt-text steps and the reviewer/judge calls happen over the
# network regardless of how the orchestrator itself is deployed.
#
# Usage:
#   docker compose up --build
#   Frontend: http://localhost:4173
#   Backend:  http://localhost:8000

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "4173:4173"
    depends_on:
      - backend
