[pytest]
# Pytest configuration for happypdf

# Where to find tests
testpaths = tests

# Test file naming pattern
python_files = test_*.py conftest.py

# Test class naming pattern
python_classes = Test*

# Test function naming pattern
python_functions = test_*

# Verbose output by default
addopts = -v --tb=short

# Coverage options (for future use)
# addopts = --cov=src --cov-report=html
